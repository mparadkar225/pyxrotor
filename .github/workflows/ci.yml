name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # compiled hot loops (pyxrotor._speedups) and the pure-Python fallback
        impl: [compiled, pure]
    name: test (${{ matrix.impl }})
    env:
      PYXROTOR_PURE: ${{ matrix.impl == 'pure' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y gfortran libx11-dev cmake

      - name: Build reference libraries
        run: reference/build.sh

      - name: Install pyxrotor
        run: pip install -e ".[test]"

      - name: Check which implementation runs
        run: |
          python -c "from pyxrotor import _accel; print('compiled built:', _accel.available, 'in use:', _accel.enabled)"
          python -c "from pyxrotor import _accel; import os; assert _accel.enabled == (os.environ.get('PYXROTOR_PURE') != '1')"

      - name: Test
        # Runs in parallel (pyproject's addopts: -n auto). A Fortran STOP inside a reference
        # call then crashes one worker, reported as a failure; with -n0 it would exit pytest
        # with status 0 before the report is written, so a missing report means a cut-short run
        run: |
          rm -f junit.xml
          pytest -v --junitxml=junit.xml
          test -s junit.xml || { echo "pytest exited inside a test (Fortran STOP?): run incomplete"; exit 1; }
